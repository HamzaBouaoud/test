<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple HTML Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: min(100%, 720px);
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 2.5rem;
      color: #0f766e;
    }

    p {
      margin: 0 auto 28px;
      max-width: 560px;
      line-height: 1.6;
      font-size: 1.05rem;
    }

    a {
      display: inline-block;
      padding: 12px 18px;
      color: #ffffff;
      background: #0f766e;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
    }

    a:hover {
      background: #115e59;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>
      This is a simple HTML page with a centered layout, responsive spacing,
      and a little styling to make it pleasant to look at.
    </p>
    <a href="https://www.example.com">Learn More</a>
  </main>
</body>
</html>
